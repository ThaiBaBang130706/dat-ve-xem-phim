name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  java:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [17, 22]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and test Java modules
        run: xvfb-run -a mvn -B verify
      - uses: actions/setup-node@v4
        if: matrix.java == 17
        with:
          node-version: '22'
      - name: Install browser for real web integration test
        if: matrix.java == 17
        run: |
          npm install --prefix target/browser --no-audit --no-fund playwright@1.62.1
          target/browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Smoke test packaged server over TCP and HTTP
        run: |
          mkdir -p target
          java -jar cinema-server/target/cinema-server-1.0.0.jar --tcp-port=15000 --http-port=15001 --db=target/smoke/cinema.db > target/server-smoke.log 2>&1 &
          CINEMA_PID=$!
          trap 'kill "$CINEMA_PID" 2>/dev/null || true' EXIT
          python3 scripts/smoke_lan.py
          if [ "${{ matrix.java }}" = "17" ]; then
            CINEMA_TCP_PORT=15000 WEB_PORT=18080 node cinema-web/server.mjs > target/web-smoke.log 2>&1 &
            WEB_PID=$!
            trap 'kill "$CINEMA_PID" "$WEB_PID" 2>/dev/null || true' EXIT
            NODE_PATH="$PWD/target/browser/node_modules" node scripts/live_web_smoke.cjs
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cinema-server-jdk-${{ matrix.java }}
          path: cinema-server/target/cinema-server-1.0.0.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-jdk-${{ matrix.java }}
          path: '**/target/surefire-reports/*'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: javafx-preview-jdk-${{ matrix.java }}
          path: |
            **/target/ui-preview/*.png
            target/web-preview/*.png
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cinema-dashboard/package-lock.json
      - name: Install dashboard dependencies
        working-directory: cinema-dashboard
        run: npm ci --no-audit --no-fund
      - name: Check and test dashboard
        working-directory: cinema-dashboard
        run: |
          npm run check
          npm test
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-dependency-lock
          path: cinema-dashboard/package-lock.json



  live-web:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check cinema-web/live.js && node --test cinema-web/server.test.mjs
