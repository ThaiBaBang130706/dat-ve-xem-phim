name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  java:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and test Java modules
        run: xvfb-run -a mvn -B verify
      - uses: actions/upload-artifact@v4
        with:
          name: cinema-server
          path: cinema-server/target/cinema-server-1.0.0.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: '**/target/surefire-reports/*'
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dashboard dependencies
        working-directory: cinema-dashboard
        run: npm install --no-audit --no-fund
      - name: Check and test dashboard
        working-directory: cinema-dashboard
        run: |
          npm run check
          npm test
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-dependency-lock
          path: cinema-dashboard/package-lock.json
